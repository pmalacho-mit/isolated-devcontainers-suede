# desolate-proxy interception ruleset (desolate integration).
#
# DESOLATE_IF is the VM-side bridge carrying the desolate stack. It is written
# by install.sh, which AUTO-DETECTS it from the compose network -- you should
# not need to edit it by hand. (Detection: resolve the network's gateway IP,
# then find the interface holding that IP.)
#
# The default matches the name pinned in docker-compose.yml
# (networks.devnet.driver_opts."com.docker.network.bridge.name"), so the rules
# keep matching across `cli.sh down && cli.sh up`. Do NOT change one without
# the other: a mismatch disables interception silently.
define DESOLATE_IF = "br-desolate"

# Hostnames allowed for non-HTTP egress (git over SSH). dnsmasq populates these
# sets with the IPs it resolves for those names -- see dnsmasq-desolate.conf.
# Without this, the default-deny forward chain would block `git clone` over SSH.
table inet desolate
delete table inet desolate
table inet desolate {

    # `flags interval` because these hold CIDRs, and no timeout because the
    # entries are a fetched fact rather than a DNS side effect -- ssh-allow.sh
    # (run by desolate-nft after every reload) refills them from GitHub's
    # published ranges. They were briefly plain timeout sets, for dnsmasq to
    # fill by hostname; that never worked, and ssh-allow.sh's header records
    # all four reasons.
    set ssh_allow_v4 { type ipv4_addr; flags interval; }
    set ssh_allow_v6 { type ipv6_addr; flags interval; }

    chain prerouting {
        type nat hook prerouting priority dstnat; policy accept;
        iifname $DESOLATE_IF tcp dport { 80, 443 } redirect to :18080
        iifname $DESOLATE_IF udp dport 53  redirect to :5353
        iifname $DESOLATE_IF tcp dport 53  redirect to :5353
    }

    chain forward {
        type filter hook forward priority filter; policy accept;
        # Replies for established flows.
        iifname $DESOLATE_IF ct state established,related accept
        # Kill QUIC so TLS clients fall back to TCP/443 where we intercept.
        iifname $DESOLATE_IF udp dport 443 drop
        # git over SSH, but ONLY to hostnames dnsmasq resolved from the
        # allowlist (github.com by default). Everything else still dies below.
        #
        # COUNTERS, because this rule depends on four things lining up -- the nft
        # set, dnsmasq's cache, docker's embedded DNS cache, and the set's 1h
        # timeout -- and when they do not, the only symptom is `ssh: connect to
        # github.com port 22: Connection timed out`. `nft list table inet
        # desolate` then shows whether the accept fired or the drop did, which is
        # the difference between "the allowlist is empty" and "something else".
        iifname $DESOLATE_IF ip  daddr @ssh_allow_v4 tcp dport 22 counter accept
        iifname $DESOLATE_IF ip6 daddr @ssh_allow_v6 tcp dport 22 counter accept
        # Default-deny: nothing from the container world leaves the VM except
        # via the proxy (18080) and the local resolver (5353), which are INPUT,
        # not FORWARD, after the redirect above.
        iifname $DESOLATE_IF counter drop
    }

    chain input {
        type filter hook input priority filter; policy accept;
        iifname $DESOLATE_IF ct state established,related accept
        iifname $DESOLATE_IF tcp dport 18080 accept  # mitmproxy
        iifname $DESOLATE_IF udp dport 5353  accept  # dnsmasq
        iifname $DESOLATE_IF tcp dport 5353  accept
        iifname $DESOLATE_IF tcp dport 18081 accept  # CA cert + install-ca.sh
        # Containers may reach nothing else on the VM (protects other services).
        iifname $DESOLATE_IF drop
    }
}
