# desolate-proxy interception ruleset (desolate integration).
#
# TWO interfaces, deliberately. The stack is split across two bridges so that
# the container world (dind, and every devcontainer inside it) and the editor
# world (vscode, orchestrator) are on separate L2 segments:
#
#   DESOLATE_IF       br-desolate       vscode + orchestrator  (the editor world)
#   DESOLATE_DIND_IF  br-desolate-in    dind                   (the container world)
#
# WHY THE SPLIT IS LOAD-BEARING. When dind and vscode shared one bridge, a
# devcontainer's packet to the editor's :3000 was BRIDGED, not routed -- so it
# only reached this forward chain if br_netfilter happened to be passing frames
# to the inet hooks. Nothing asserted that, and if it were ever off the
# lateral wall would vanish while every other check here still passed (egress
# to the internet is routed and stays filtered either way). Across two bridges
# the same packet is a ROUTED hop, which this chain always sees.
#
# Both names are written by install.sh, which AUTO-DETECTS them from the two
# compose networks -- you should not need to edit them by hand. (Detection:
# resolve each network's gateway IP, then find the interface holding it.)
#
# The defaults match the names pinned in docker-compose.yml
# (networks.devnet / networks.dindnet driver_opts
# "com.docker.network.bridge.name"), so the rules keep matching across
# `cli.sh down && cli.sh up`. Do NOT change one without the other: a mismatch
# disables interception silently.
define DESOLATE_IF = "br-desolate"
define DESOLATE_DIND_IF = "br-desolate-in"
# Everything that is subject to interception and default-deny egress.
define DESOLATE_IFS = { "br-desolate", "br-desolate-in" }

# Addresses the proxy must never DIAL on a container's behalf -- see the output
# chain. This mirrors addon.py's is_internal(), which is `not is_global` plus
# the terms CPython's definition leaves out, and is deliberately a little wider:
# this is the outer layer, so it errs toward refusing. 100.64.0.0/10 is here for
# the reason it is there too -- RFC 6598 shared space is not "private" to
# CPython, and it is where a tailnet lives.
#
# One line each on purpose: an anonymous set spanning lines is a construct this
# file does not otherwise use, and a ruleset that fails to parse does not fail
# half way -- `nft -f` applies nothing, so interception and the forward
# default-deny would both be absent together.
define DESOLATE_INTERNAL4 = { 0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16, 198.18.0.0/15, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 240.0.0.0/4 }
define DESOLATE_INTERNAL6 = { ::/128, ::1/128, fc00::/7, fe80::/10, ff00::/8 }

# Hostnames allowed for non-HTTP egress (git over SSH). dnsmasq populates these
# sets with the IPs it resolves for those names -- see dnsmasq-desolate.conf.
# Without this, the default-deny forward chain would block `git clone`.
table inet desolate
delete table inet desolate
table inet desolate {

    # `flags interval` because these hold CIDRs, and no timeout because the
    # entries are a fetched fact rather than a DNS side effect -- ssh-allow.sh
    # (run by desolate-nft after every reload) refills them from GitHub's
    # published ranges. They were briefly plain timeout sets, for dnsmasq to
    # fill by hostname; that never worked, and ssh-allow.sh's header records
    # all four reasons.
    set ssh_allow_v4 { type ipv4_addr; flags interval; }
    set ssh_allow_v6 { type ipv6_addr; flags interval; }

    chain prerouting {
        type nat hook prerouting priority dstnat; policy accept;
        iifname $DESOLATE_IFS tcp dport { 80, 443 } redirect to :18080
        iifname $DESOLATE_IFS udp dport 53  redirect to :5353
        iifname $DESOLATE_IFS tcp dport 53  redirect to :5353
    }

    chain forward {
        type filter hook forward priority filter; policy accept;

        # ── LATERAL CONTAINMENT ───────────────────────────────────────────
        # FIRST, ahead of the established-state accept, so that not even a
        # reply can cross. Nothing in the stack needs IP connectivity between
        # these bridges or within them: orchestrator<->dind is a unix socket in
        # the inner-run volume, vscode<->orchestrator is a unix socket in
        # broker-run, and dind's path to the proxy (18080/18081) and resolver
        # (5353) is INPUT to the VM after the redirect above, not FORWARD.
        #
        # So this is a stated invariant, not a side effect of the egress
        # default-deny below: a devcontainer cannot address the editor
        # container, where the git deploy keys live.
        #
        # COUNTERS, because a nonzero count here is an attempted escape and is
        # worth being able to see: `nft list table inet desolate`.
        iifname $DESOLATE_DIND_IF oifname $DESOLATE_IF      counter drop
        iifname $DESOLATE_IF      oifname $DESOLATE_DIND_IF counter drop
        iifname $DESOLATE_IF      oifname $DESOLATE_IF      counter drop
        iifname $DESOLATE_DIND_IF oifname $DESOLATE_DIND_IF counter drop

        # Replies for established flows.
        iifname $DESOLATE_IFS ct state established,related accept
        # Kill QUIC so TLS clients fall back to TCP/443 where we intercept.
        iifname $DESOLATE_IFS udp dport 443 drop
        # git over SSH, but ONLY from the EDITOR bridge, and only to addresses
        # ssh-allow.sh fetched (GitHub by default).
        #
        # Scoped to $DESOLATE_IF on purpose. The editor is where deploy keys
        # are minted and where `git push` runs; a devcontainer has no business
        # speaking SSH to anywhere. Leaving this open to the container world
        # pre-authorised the exfiltration half of a key theft -- reach the key
        # by any means and the route out was already allowed.
        #
        # COUNTERS, because this rule depends on four things lining up -- the
        # nft set, dnsmasq's cache, docker's embedded DNS cache, and the set's
        # refill -- and when they do not, the only symptom is `ssh: connect to
        # github.com port 22: Connection timed out`. `nft list table inet
        # desolate` then shows whether the accept fired or the drop did, which
        # is the difference between "the allowlist is empty" and "something
        # else".
        iifname $DESOLATE_IF ip  daddr @ssh_allow_v4 tcp dport 22 counter accept
        iifname $DESOLATE_IF ip6 daddr @ssh_allow_v6 tcp dport 22 counter accept
        # Default-deny: nothing from the container world leaves the VM except
        # via the proxy (18080) and the local resolver (5353), which are INPUT,
        # not FORWARD, after the redirect above.
        iifname $DESOLATE_IFS counter drop
    }

    chain input {
        type filter hook input priority filter; policy accept;
        iifname $DESOLATE_IFS ct state established,related accept
        iifname $DESOLATE_IFS tcp dport 18080 accept  # mitmproxy
        iifname $DESOLATE_IFS udp dport 5353  accept  # dnsmasq
        iifname $DESOLATE_IFS tcp dport 5353  accept
        iifname $DESOLATE_IFS tcp dport 18081 accept  # CA cert + install-ca.sh
        # Containers may reach nothing else on the VM (protects other services).
        iifname $DESOLATE_IFS drop
    }

    # ── THE DEPUTY'S OWN EGRESS ───────────────────────────────────────────
    # Everything above filters packets FROM the container bridges. This chain
    # filters packets the proxy sends on their behalf, which the rules above
    # cannot see: prerouting REDIRECTs :80/:443 here whatever the destination
    # was, and mitmproxy then dials that destination from the VM, as a VM
    # process, where neither the forward default-deny nor the input drop
    # applies. Without this chain the proxy is a route to the Mac and the LAN
    # for anything that can reach :80/:443 -- which is every container.
    #
    # addon.py refuses internal destination ADDRESSES itself, and that refusal
    # is unit-tested (the E10 family). This chain exists because that refusal
    # cannot be the whole wall:
    #
    #   - connection_strategy=eager (pinned in desolate-proxy.service, and for
    #     good reasons -- see tests/static/06-proxy-service.sh) dials the
    #     original destination as soon as the client connects, which is BEFORE
    #     the request hook can refuse it. The addon bounds what is exchanged;
    #     only this bounds whether the connection happens at all;
    #   - `tls_passthrough` entries are tunnelled straight from tls_clienthello
    #     and never reach the request hook, so addon.py never sees them;
    #   - and an addon that fails to load leaves a working transparent proxy
    #     that enforces nothing.
    #
    # Each of those is a different way for the addon's check to be absent. None
    # of them reach the kernel.
    chain output {
        type filter hook output priority filter; policy accept;

        # REPLIES FIRST, and deliberately not scoped to a uid. mitmproxy answers
        # every intercepted client on the container bridges, and the CA server
        # (same uid) serves them on :18081 -- those are OUTPUT packets to a
        # 172.16/12 address, from the very uid this chain restricts. Judging
        # them by destination would drop every reply the stack is built on.
        # Conntrack is what tells a reply apart from a connection the proxy
        # STARTS, which is the only thing being restricted here.
        ct state established,related accept

        # Name resolution, before the drops, or this chain takes down all
        # egress. The proxy resolves the hosts it dials through the VM's own
        # resolver, and on Colima that resolver is itself an RFC1918 address
        # reached over vmnet -- a rule that dropped it would make every request
        # time out, with nothing pointing back here.
        meta skuid desolate-proxy oifname "lo" accept
        meta skuid desolate-proxy udp dport 53 accept
        meta skuid desolate-proxy tcp dport 53 accept

        # The wall. The address lists are defined at the top of this file, next
        # to the interface names.
        #
        # An IPv4-mapped destination (::ffff:192.168.5.2) leaves the host as an
        # ordinary IPv4 packet, so the v4 rule catches it; there is nothing
        # extra to write for that spelling.
        #
        # COUNTERS, because a nonzero count here is a container trying to reach
        # the Mac or the LAN through the proxy, and this is the only place that
        # attempt is visible at all: `nft list table inet desolate`.
        meta skuid desolate-proxy ip  daddr $DESOLATE_INTERNAL4 counter drop
        meta skuid desolate-proxy ip6 daddr $DESOLATE_INTERNAL6 counter drop
    }
}
