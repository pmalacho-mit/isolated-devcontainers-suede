# Safe browser-based dev environment
#
#   browser ──127.0.0.1:$VSCODE_PORT──▶ [vscode: VSCodium Web Host]    (default 3000)
#                                     │  NO docker socket -- broker client only
#                                     │  unix socket (broker-run volume)
#                                     ▼
#                               [orchestrator: broker.ts]
#                                     │  DOCKER_HOST=unix:///run/inner/docker.sock
#                                     ▼
#                               [dind: inner dockerd]  ◀── devcontainers live HERE
#                                     │  unix socket (shared volume, never TCP)
#                                     ▼
#                               observe.sh, via `docker exec` on the orchestrator
#
# Invariants:
#   - The HOST docker socket is never mounted anywhere.
#   - The inner dockerd listens ONLY on a unix socket inside a named volume.
#   - Only the orchestrator mounts that socket. The editor reaches the daemon
#     solely through the broker's fixed op vocabulary, never directly.
#   - The only host-reachable surface is VSCODE_PORT (default 3000) -- the editor,
#     token-gated -- bound to 127.0.0.1. Nothing else is published except the
#     dev-server range.
#   - dind sits on its OWN bridge (dindnet), NOT the one carrying the editor.
#     Devcontainers live inside dind and egress through its address, so sharing
#     a bridge with vscode put the editor -- and the git deploy keys in it --
#     one routable hop from every project. See networks: at the bottom.

name: desolate

services:
  # ── One-shot volume initializer ───────────────────────────────────────
  # If dind were created first it would create the shared volumes as empty, root-owned dirs:
  # user 1000 wouldn't be able to write /workspaces or bind /run/broker/desolate.sock,
  # and server-dist would never receive the server (auto-seed only fires for the volume-creating container). 
  # This runs once as root, fixes ownership, and seeds or upgrades the server copy, then exits.
  volume-init:
    build: ./vscode-image
    container_name: desolate-volume-init
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        chown 1000:1000 /workspaces
        # The orchestrator runs as uid 1000 and BINDS /run/broker/desolate.sock.
        # Binding needs write permission on the directory.
        # (This differs from /run/inner as the orchestrator only CONNECTS to it.)
        chown 1000:1000 /run/broker
        VER=$$(cat /home/.desolate-server/.version 2>/dev/null || true)
        # Fail closed: an image without a version stamp cannot be compared
        # against what is already seeded, and seeding anyway would leave the
        # volume claiming a version it does not hold.
        [ -n "$$VER" ] || { echo "no /home/.desolate-server/.version in the image"; exit 1; }
        CUR=$$(cat /server-dist/.seeded-version 2>/dev/null || true)
        if [ ! -x /server-dist/bin/codium-server ] || [ "$$VER" != "$$CUR" ]; then
          echo "seeding editor server $$VER into server-dist volume..."
          rm -rf /server-dist/* 2>/dev/null || true
          cp -a /home/.desolate-server/. /server-dist/
          printf '%s' "$$VER" > /server-dist/.seeded-version
        fi
        chown -R 1000:1000 /server-dist
        echo "volume-init: done"
    volumes:
      - workspaces:/workspaces
      - server-dist:/server-dist
      - inner-run:/run/inner
      - broker-run:/run/broker
    restart: "no"

  # ── Inner Docker daemon (docker-in-docker) ────────────────────────────
  dind:
    # Floating major on purpose: patch/minor rebuilds carry the Alpine security
    # fixes, and a hard pin here rots silently.
    #
    # Two things about 28+ handled below:
    #   - it needs the kernel's `ipset` in the VM, because dind under sysbox
    #     cannot load modules itself (vm/install.sh checks for it);
    #   - containerd 2.x dropped the default LimitNOFILE from ~1M to 1024,
    #     which would surface as EMFILE errors for file watchers in devcontainers
    #     (so `--default-ulimit` is explicitly set below).
    image: docker:29-dind
    container_name: desolate-dind
    depends_on:
      volume-init:
        condition: service_completed_successfully
    # Runs UNPRIVILEGED under the sysbox runtime: container-root maps to an
    # unprivileged VM user, so a compromised dind cannot reach the VM/host, and
    # the docker-in-docker feature works nested without privilege.
    runtime: sysbox-runc
    # Install the proxy CA before dockerd starts: image pulls traverse the
    # intercepting proxy, so the daemon must trust it. No-op if not installed.
    entrypoint:
      - /bin/sh
      - -c
      - '[ -x /desolate-ca/install-ca.sh ] && /desolate-ca/install-ca.sh >/dev/null 2>&1 || true; exec dockerd-entrypoint.sh "$$@"'
      - --
    environment:
      DOCKER_TLS_CERTDIR: ""          # no TCP listener at all -> no TLS needed
    command:
      - dockerd
      - --host=unix:///run/inner/docker.sock
      - --group=1000                  # gid of the editor user, grants socket access
      - --icc=true
      # What the INNER daemon hands its containers. sysbox gives dind
      # soft=1024/hard=524288, and containers inherit the daemon's limits when
      # this flag is absent -- so without it every devcontainer runs at a 1024
      # soft limit, which one language server + bundler + watcher would exhaust.
      # 524288 is sysbox's ceiling for dind and cannot be exceeded.
      - --default-ulimit=nofile=65536:524288
    # The daemon's OWN limits, which are NOT the flag above: dockerd and
    # containerd hold fds for every container at once, so they get the full
    # ceiling rather than one container's allowance.
    ulimits:
      nofile:
        soft: 524288
        hard: 524288
    volumes:
      - /var/lib/desolate-proxy/public:/desolate-ca:ro   # proxy CA (public cert only)
      - inner-run:/run/inner          # the inner socket lives here
      - dind-sysbox-data:/var/lib/docker  # inner images/containers
      # MUST match the vscode mount path so devcontainer bind mounts resolve
      - workspaces:/workspaces
      # This is the pristine editor server, and it is the LOWER LAYER of the
      # per-project overlayfs volume `desolate` builds for each devcontainer
      # (see ensureServerVolume in vscode-image/desolate.ts). Every devcontainer
      # EXECUTES /vscode-server/bin/codium-server out of its own overlay.
      # Nothing but volume-init may write here. If a project could reach this
      # directory, it would be writing the binary every OTHER project runs.
      # overlayfs already prevents that from the project side -- writes are
      # copied up, never down -- and `:ro` is the second lock, covering anything
      # inside dind that touches the path directly.
      - server-dist:/server-dist:ro
    healthcheck:
      # Healthy only once dockerd is up and the socket exists -- dependents
      # wait on this, which fixes the startup race on first boot.
      test: ["CMD", "docker", "-H", "unix:///run/inner/docker.sock", "info"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 15s
    ports:
      # Reaches editors/apps running INSIDE devcontainers. Chain:
      #   Mac 127.0.0.1:PORT -> dind's netns :PORT -> socat relay container
      #   (joined to the devcontainer's network) -> devcontainer bridge IP.
      # Widen the range in .env with the following variables:
      #   DESOLATE_PORT_MIN=8080
      #   DESOLATE_PORT_MAX=8120
      # The SAME two variables are handed to the orchestrator, which is what
      # desolate.ts allocates from. Do NOT hardcode either side.
      - "127.0.0.1:${DESOLATE_PORT_MIN:-8080}-${DESOLATE_PORT_MAX:-8090}:${DESOLATE_PORT_MIN:-8080}-${DESOLATE_PORT_MAX:-8090}"
    # NOT devnet. dind is the container world; devnet is the editor world.
    networks: [dindnet]
    restart: unless-stopped

  # ── Orchestrator: the ONLY container with inner-dind-daemon access ──────
  # Runs the broker, a narrow request API over a unix socket. The editor can
  # ask it to start/stop/inspect a project's devcontainer -- nothing else. It
  # validates both the project name AND the project's devcontainer.json, 
  # so a project cannot request another project's volumes, bind mounts, 
  # or privilege escalation.
  orchestrator:
    build: ./vscode-image           # same image as vscode (below); different entrypoint
    container_name: desolate-orchestrator
    depends_on:
      dind:
        condition: service_healthy
    user: "1000:1000"
    environment:
      DOCKER_HOST: unix:///run/inner/docker.sock
      DESOLATE_BROKER: /run/broker/desolate.sock
      # The range desolate.ts allocates relay ports from. MUST be the same two
      # variables dind publishes above.
      DESOLATE_PORT_MIN: ${DESOLATE_PORT_MIN:-8080}
      DESOLATE_PORT_MAX: ${DESOLATE_PORT_MAX:-8090}
    entrypoint: ["/usr/local/bin/with-ca", "tsx", "/usr/local/lib/desolate/broker.ts"]
    volumes:
      - /var/lib/desolate-proxy/public:/desolate-ca:ro   # proxy CA (public cert only)
      - inner-run:/run/inner        # the daemon socket lives here ONLY
      - workspaces:/workspaces
      # Read-only for the same reason as dind's copy above: the orchestrator
      # only ever names this path as a bind SOURCE for devcontainers, never
      # writes it. Leaving it writable would give a compromised orchestrator a
      # way to poison the binary every project executes.
      - server-dist:/server-dist:ro
      - broker-run:/run/broker
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 2048
    networks: [devnet]
    restart: unless-stopped

  # The ONLY container that holds raw private keys.
  #
  # The editor shares /workspaces read-write with every devcontainer, and a
  # repo's .git/config and .gitattributes are executable configuration -- so a
  # compromised project gets code execution in the editor whenever the editor
  # runs git against it. That path is a shared filesystem, not a socket, so no
  # nftables rule reaches it. The keys move out of reach instead.
  #
  # Note what is NOT here: no /workspaces, no inner-run, no docker socket, no
  # published port, and no network at all. This container reads no project
  # content and talks to nothing. It hands out an agent socket and public keys.
  keyring:
    build: ./vscode-image           # same image; ssh-agent + ssh-keygen already in it
    container_name: desolate-keyring
    user: "1000:1000"
    entrypoint: ["tsx", "/usr/local/lib/desolate/keyring.ts"]
    volumes:
      # Private keys. Mounted HERE AND NOWHERE ELSE -- that mount list is the
      # whole security property, and tests/static/07-keyring.sh asserts it.
      - keyring-keys:/var/lib/keyring
      # Agent socket + exported PUBLIC halves. Shared with the editor, which
      # gets it read-only (see below).
      - keyring-run:/run/keyring
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 512
    # NO NETWORK. Not devnet, not anything: this process speaks over two unix
    # sockets in a volume and has no reason to hold an IP.
    #
    # It was on devnet, which was wrong in two ways. devnet is the editor's
    # bridge, and the editor is kept off the keyring only by the VM's nftables
    # rule `iifname br-desolate oifname br-desolate drop` -- a host install
    # step, so `docker compose up` on its own gave the editor a route to the
    # key holder. devnet is also the bridge carrying the pre-authorised egress
    # to GitHub's :22, so the container holding the keys was the one container
    # that also held a way out with them.
    network_mode: none
    restart: unless-stopped

  vscode:
    build: ./vscode-image           # same image as orchestrator (above); different entrypoint
    container_name: desolate-vscode
    depends_on:
      dind:
        condition: service_healthy
      orchestrator:
        condition: service_started    # broker socket must exist
      keyring:
        condition: service_started    # agent socket must exist
    user: "1000:1000"
    environment:
      # NO DOCKER_HOST. The editor has no daemon access at all.
      # It is solely a viewer/editor over /workspaces plus a broker CLIENT. 
      # Starting devcontainers goes through the orchestrator's narrow broker API, 
      # so a malicious extension here cannot create containers, 
      # mount other projects' volumes, or exec into siblings.
      DESOLATE_BROKER: /run/broker/desolate.sock
      # Deliberately NOT set: GPG_AGENT_INFO, GIT_ASKPASS.
      # Nothing forwards your HOST agents into this stack -- SSH_AUTH_SOCK
      # below is the stack's own keyring, not yours. It is an agent socket, so
      # a compromised editor can USE a deploy key while compromised but cannot
      # copy one: the private halves never leave the keyring container.
      SSH_AUTH_SOCK: /run/keyring/agent.sock
    entrypoint: 
      # Run the editor server with certificate support and exactly the flags
      # specified in `command` and nothing else. The path must match
      # DESOLATE_SERVER_ROOT and SERVER_BIN (vscode-image/editor.ts).
      - /usr/local/bin/with-ca
      # Seeds the workspace-trust defaults on first start; see shell-entry.sh.
      - /usr/local/bin/shell-entry
      # The SHELL root, not the server root: same build, hardlinked, with the
      # git/github extensions removed. This editor can reach the keyring's agent
      # socket, and the git extension is what turns a hostile repository into
      # code execution here -- it runs `git`, and `git` obeys that repository's
      # own .git/config. Devcontainers are seeded from DESOLATE_SERVER_ROOT and
      # keep git, where there is no agent socket to reach.
      - /home/.desolate-shell/bin/codium-server
    command:
      - --host=0.0.0.0                # inside the container; host binding is 127.0.0.1 below
      - --port=3000
      - --connection-token=${VSCODE_TOKEN:?set VSCODE_TOKEN in .env}
    volumes:
      # NOTE: inner-run is deliberately ABSENT -- no docker socket here.
      - /var/lib/desolate-proxy/public:/desolate-ca:ro   # proxy CA (public cert only)
      - workspaces:/workspaces        # full read/write: the universal editor
      - vscode-home:/home/workspace   # settings + extensions persist here
      - broker-run:/run/broker        # narrow request channel to orchestrator
      # Agent socket + PUBLIC keys. keyring-keys is deliberately absent.
      #
      # READ-ONLY, and it still works: connecting to a unix socket is an inode
      # permission check, not a filesystem write, so a ro mount does not block
      # it (MS_RDONLY only refuses writes to regular files, dirs and symlinks).
      # The editor never needs to write here -- newrepo reads pub/*.pub paths
      # and connects to two sockets. Leaving it writable let a compromised
      # editor rewrite an exported .pub, which is what every `IdentityFile`
      # line in ~/.ssh/config points at: the per-host identity pinning that
      # keeps `IdentitiesOnly yes` honest would then be pinning to whatever the
      # attacker put there.
      - keyring-run:/run/keyring:ro
    ports:
      # Set VSCODE_PORT in .env to move the editor off 3000 (e.g. when something
      # else on your Mac already uses it). It MUST stay outside of
      # DESOLATE_PORT_MIN..MAX -- dind publishes that whole range on the same
      # loopback address, and the two publishes would collide;
      - "127.0.0.1:${VSCODE_PORT:-3000}:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 2048
    networks: [devnet]
    restart: unless-stopped

volumes:
  keyring-keys:   # private keys -- keyring only
  keyring-run:    # agent socket + public keys -- keyring + editor
  inner-run:
  broker-run:
  dind-sysbox-data:
  workspaces:
  vscode-home:
  server-dist:

networks:
  # The EDITOR world: vscode + orchestrator.
  devnet:
    driver: bridge
    driver_opts:
      # PIN THE BRIDGE NAME. Without this, docker derives it from the network
      # id (br-<hash>), so `cli.sh down && cli.sh up` produces a NEW name --
      # and the VM's nftables rules, which match on iifname, silently stop
      # matching (meaning no proxy). A fixed name makes the rules survive recreation.
      com.docker.network.bridge.name: br-desolate

  # The CONTAINER world: dind, and therefore every devcontainer, since they
  # egress through dind's address on this bridge.
  #
  # Nothing bridges these two networks. Nothing needs to: orchestrator->dind is
  # a unix socket in the inner-run volume, vscode->orchestrator is a unix socket
  # in broker-run, and dind's egress goes to the VM itself (proxy 18080, CA
  # 18081, resolver 5353), which is INPUT rather than FORWARD. The nftables
  # ruleset drops traffic between the two bridges explicitly, first, ahead of
  # its established-state accept.
  dindnet:
    driver: bridge
    driver_opts:
      # Same pin, same reason. Kept to 14 chars: Linux caps interface names at 15
      # (IFNAMSIZ-1) and silently rejects anything longer, so "br-desolate-dind"
      # would NOT have worked.
      com.docker.network.bridge.name: br-desolate-in
