<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>desolate: pushes waiting</title>
<link rel="stylesheet" href="/approve.css">
<script src="/approve.js" defer></script>
</head>
<body>
<header>
  <h1>Pushes waiting for you</h1>
  <p class="lede">Each push below leaves for the remote only if you approve it here. What it names is read from the text that gets signed; what it would send was worked out in the root by desolate's reviewer.</p>
</header>
<main id="list" aria-live="polite"></main>
<p id="status" class="status"></p>
<template id="card">
  <section class="card">
    <dl class="names">
      <dt>repository</dt><dd class="repo"></dd>
      <dt>branch</dt><dd class="branch"></dd>
      <dt>commit</dt><dd class="commit mono"></dd>
    </dl>
    <p class="onto"></p>
    <div class="summary"></div>
    <div class="actions">
      <span class="arm"><button type="button" class="approve" disabled>Approve push</button></span>
      <button type="button" class="refuse">Refuse</button>
      <span class="hint"></span>
    </div>
  </section>
</template>
</body>
</html>
