# /etc/desolate-proxy/dnsmasq.conf
#
# A DEDICATED dnsmasq instance for containers, started by desolate-dnsmasq
# .service with `-C this-file`. It is NOT a drop-in.
#
# This must never be installed into /etc/dnsmasq.d/. Colima's VM has no
# systemd-resolved -- its system resolver IS dnsmasq, on 192.168.5.1:53, which
# is where Colima's generated /etc/resolv.conf points. dnsmasq runs as ONE
# process reading /etc/dnsmasq.conf plus all of /etc/dnsmasq.d/, and `port=` is
# a global option. So a drop-in carrying `port=5353` does not add a second
# resolver -- it MOVES the system one off :53 and the VM loses all name
# resolution, which then surfaces as an unresolvable registry on the next image
# pull. `no-resolv` below would likewise have replaced the VM's upstreams.
# Keeping this in its own instance leaves Colima's resolver untouched.
#
# Container DNS (redirected to :5353 by nftables) resolves here, not wherever
# the workload chose.
port=5353
no-resolv
server=1.1.1.1
server=8.8.8.8
log-queries
cache-size=1000


# Do not read the system config or drop-in directory: this instance is
# self-contained, and inheriting Colima's settings is exactly the coupling the
# header warns about.
conf-file=
conf-dir=

# Bind addresses as interfaces APPEAR, rather than only those present at start.
# br-desolate is created and destroyed by `cli.sh down`/`up`, so a static bind
# would leave this deaf on the one interface that matters after the first
# recreate -- a silent failure, since the nftables redirect would still point at
# a port nothing is listening on for that address.
bind-dynamic

pid-file=/run/desolate-dnsmasq.pid

# NO nftset= lines here, deliberately. They used to fill the git-over-SSH
# allowlist by hostname and never once worked -- most fundamentally because
# containers resolve through Docker's embedded DNS at 127.0.0.11, which forwards
# upstream from a path the nftables redirect never sees, so this resolver never
# observes the lookups at all. ssh-allow.sh now fills those sets from GitHub's
# published ranges instead. See its header.
