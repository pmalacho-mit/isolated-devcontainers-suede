# Run from INSIDE the devcontainer's terminal:
#   cd /workspaces/sample-fastapi
#   /desolate-ca/trust-proxy-in-builds.sh --service api --image python:3.12-slim   # once
#   docker compose up --build
#
# That first line derives a base image trusting the egress proxy's CA and writes
# a gitignored compose.override.yml pointing this build at it. Without it the
# `pip install` in the Dockerfile fails certificate verification, because all
# egress is intercepted and a stock python:3.12-slim does not trust the
# interceptor. See "Building your own containers inside a devcontainer" in the
# README. Nothing below, and nothing in the Dockerfile, is desolate-specific.
#
# Level-3: this runs on the devcontainer's OWN docker daemon. The API key is a
# PLACEHOLDER inherited from the devcontainer environment -- the real value is
# substituted by the VM proxy on the way out, and only toward api.openai.com.
services:
  api:
    build: .
    environment:
      # Placeholder passthrough. Contains no secret material.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-SAMPLE-FASTAPI-OPENAI-KEY}
    ports:
      - "0.0.0.0:8000:8000"
