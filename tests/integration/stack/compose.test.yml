# Overrides for the TEST stack: its own container names and its own host ports.
#
# The container names are the load-bearing part. docker-compose.yml pins
# `container_name:` on every service, and `container_name` OVERRIDES compose's
# `<project>-<service>-<n>` naming -- so `-p desolate-test` alone changed the
# project label and nothing else, and every container came up as `desolate-*`.
# The harness looked for `desolate-test-dind-1`, found nothing, and reported
# `no such object` for the whole suite while `compose up` reported success.
#
# NOTE: this stack still cannot run CONCURRENTLY with a real one. The two
# bridge names in docker-compose.yml are pinned (br-desolate / br-desolate-in),
# and a second bridge cannot take an existing interface name. Overriding them
# here would be worse: the VM's nftables rules are armed for the pinned names,
# so a renamed test bridge gets no interception at all and E8's proxy probes
# would silently pass by measuring nothing. Run `./cli.sh down` first.
#
# Dev-server and project-editor ports are NOT remapped here: there is no
# published range any more. Each is a listener desolate-ingress opens in the VM
# from a ports/ file, so the port desolate prints is the port the Mac uses --
# which is also why this stack, like the real one, needs the ingress installed
# (./cli.sh vm install --proxy-only) and cannot share the VM with a running one.
services:
  volume-init:
    container_name: desolate-test-volume-init
  dind:
    container_name: desolate-test-dind
  supervisor:
    container_name: desolate-test-supervisor
    environment:
      # compose names this stack's volumes and networks desolate-test_*, and
      # its shared dind desolate-test-dind.
      DESOLATE_VOLUME_PREFIX: desolate-test_
      DESOLATE_SHARED_DIND_CONTAINER: desolate-test-dind
  orchestrator:
    container_name: desolate-test-orchestrator
  vscode:
    container_name: desolate-test-vscode
    ports: !override
      - "127.0.0.1:3100:3000"
