name: tests
# The static + unit suites on a clean checkout: no daemon, no VM, no network
# beyond installing the pinned tools. See docs/ci.md.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18
      - name: Install typescript (the type check skips without it)
        run: npm ci
      - name: Install mitmproxy for the proxy addon tests
        run: |
          python3 -m venv /tmp/desolate-test
          /tmp/desolate-test/bin/pip install 'mitmproxy==11.0.2' pytest
      - name: Static + unit
        env:
          DESOLATE_PYTHON: /tmp/desolate-test/bin/python
        run: ./tests/run.sh
